name: Build & Deploy
on:
  push:
    branches:
      - master

  schedule:
    # 每天 5:30 和 17:30 UTC 触发工作流程
    - cron: '30 5,17 * * *'
  # schedule:
  # 每整点隔三小时 触发工作流程
    # - cron: '0 */3 * * *'
  #   0 */2 * * *：这个表达式的意思是：
  #   0：表示在每个小时的第 0 分钟触发（即整点）。
  #   */3：表示每 3 小时触发一次。
  #   *：表示每天的每一天。
  #   *：表示每个月的每一天。
  #   *：表示每年的每一天。

env: # 设置环境变量
  TZ: Asia/Shanghai # 时区（设置时区可使页面中的`最近更新时间`使用时区时间）

jobs:
  build-deploy:
    env: 
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      ID: ${{ secrets.GITHUB_ID }}
      SECRET: ${{ secrets.GITHUB_SECRET }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - name: Modify Version(Date)
        shell: bash
        run: |
          node -e 'var pkg = require("./package.json"); pkg.version= (new Date().getFullYear().toString().substr(2)) + "." + (new Date().getMonth() + 1) + "." + (new Date().getDate()); require("fs").writeFileSync("./package.json", JSON.stringify(pkg, null, 2))'

    #   - name: 缓存
    #     uses: actions/cache@v4
    #     id: cache-dependencies
    #     with:
    #       path: node_modules
    #       key: ${{runner.OS}}-${{hashFiles('**/package-lock.json')}}

    #   - name: 安装插件
    #     if: steps.cache-dependencies.outputs.cache-hit != 'true'
    #     run: |
    #       npm install

      - run: npm run get:trending
      # - run: npm run get:repos
      # - run: npm run get:users
      # - run: npm run get:users:china
      # - run: cat .cache/users.json
      # - run: cat .cache/users.china.json
      # - run: npm run get:users:info

      - run: npm run start
      - run: mkdir -p web/data
      - run: cp -rf dist/* web/data

      - name: Advanced Debug Deploy
        run: |
          # 1. 准备 SSH 目录
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 2. 写入私钥 (请确保你的 Secret 变量名正确)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 3. 这里的端口和地址请换成你真实的内网穿透公网 IP/域名 和 端口
          # 建议先扫描，如果扫描失败也不要让脚本停止
          ssh-keyscan -t rsa -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts || true
      
          # 4. 关键：测试 SSH 连通性 (不执行 push，只看能不能连上)
          echo "Testing SSH Connection..."
          ssh -v -o StrictHostKeyChecking=no -p ${{ secrets.REMOTE_PORT }} git@${{ secrets.REMOTE_HOST }} || echo "SSH Test failed but continuing..."
      
          # 5. Git 操作
          cd ./web
          git init
          git config user.name "Auto Deploy"
          git config user.email "deploy@example.com"
          git add .
          
          # 允许空提交，防止因为没有文件变化而报错导致脚本退出
          git commit -m "Auto updated at $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          
          # 6. 执行推送，并强制显示所有调试信息
          echo "Starting Git Push..."
          export GIT_SSH_COMMAND="ssh -v -o StrictHostKeyChecking=no -p ${{ secrets.REMOTE_PORT }}"
          git push --force "git@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}" master:master
